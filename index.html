<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말씀길 — 오프라인 성경 묵상</title>
<meta name="description" content="말씀길 — 인터넷 없이 읽고, 찾고, 기록하는 성경 앱. 콜로폰랩스.">
<style>
  :root{
    --paper:#F7F6F2; --ink:#22262B; --jjok:#33527A;
    --muted:#6E6A61; --hair:#E4E1D8;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{background:var(--paper)}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", sans-serif;
    color:var(--ink); font-size:17px; line-height:1.75;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{max-width:26rem; padding:2rem 1.5rem; text-align:center}
  .brand{color:var(--jjok); font-size:.85rem; font-weight:700; letter-spacing:.35em; margin-bottom:1.25rem}
  h1{font-size:2.2rem; font-weight:800; letter-spacing:-.02em}
  .tag{margin-top:.75rem; color:var(--muted)}
  .divider{width:2px; height:3rem; background:var(--hair); margin:2rem auto}
  nav a{
    display:block; padding:.9rem 1rem; margin-top:.75rem;
    border:1px solid var(--hair); border-radius:8px; background:#FFF;
    color:var(--ink); text-decoration:none; font-weight:600;
  }
  nav a:hover{border-color:var(--jjok); color:var(--jjok)}
  footer{margin-top:2.5rem; color:var(--muted); font-size:.85rem}
</style>
</head>
<body>
<main class="card">
  <p class="brand">COLOPHON LABS</p>
  <h1>말씀길</h1>
  <p class="tag">인터넷 없이 읽고, 찾고, 기록하는 성경 앱</p>
  <div class="divider" aria-hidden="true"></div>
  <nav>
    <a href="support.html">지원 · 자주 묻는 질문</a>
    <a href="privacy.html">개인정보처리방침</a>
  </nav>
  <footer>© 콜로폰랩스(Colophon Labs)</footer>
</main>
</body>
</html>
